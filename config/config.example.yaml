# JARVIS Configuration

ai:
  provider: ollama
  ollama_base_url: "http://localhost:11434"
  ollama_model: "llama3"
  temperature: 0.7
  max_tokens: 2048

language:
  default: "auto"
  preferred: "en"
  tts_language: "en"

voice:
  enabled: false
  stt_model: "base"
  wake_word: "jarvis"
  wake_word_enabled: false

tts:
  enabled: false
  engine: "pyttsx3"
  rate: 175
  volume: 0.9

haven:
  root: ""
  enabled: false

email:
  enabled: false
  imap_host: ""
  imap_port: 993
  smtp_host: ""
  smtp_port: 587
  username: ""
  # password is read from .env — never store here

whatsapp:
  enabled: false

browser:
  enabled: true
  headless: false

batch:
  default_size: 5
  max_retries: 3

memory:
  max_conversation_history: 50
  auto_summarize: true

security:
  require_confirmation_for_send: true
  require_confirmation_for_delete: true
  require_confirmation_for_shutdown: true

ui:
  theme: "dark"
  animations: true
  reactor_speed: 1.0

logging:
  level: "INFO"
  file: "data/logs/jarvis.log"
  max_size_mb: 10
  backup_count: 5
